#
# Review an LTP patch series using GitHub Copilot CLI.
# Triggered by ci-patchwork-trigger.yml or manually.

name: "Copilot patch review"

on:
  workflow_dispatch:
    inputs:
      SERIES_ID:
        description: Patchwork series ID
        required: true

permissions:
  contents: read

env:
  LTP_UPSTREAM: https://github.com/linux-test-project/ltp.git
  AGENT_DIR: ${{ github.workspace }}
  PATCHWORK_URL: ${{ vars.PATCHWORK_URL || 'https://patchwork.kernel.org' }}

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ltp-agent
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Install dependencies
        run: |
          pip install b4 'pwclient @ git+https://github.com/getpatchwork/pwclient'

          cat > ~/.pwclientrc <<EOF
          [options]
          default = ltp

          [ltp]
          backend = rest
          url = $PATCHWORK_URL/api/
          EOF

      - name: Clone LTP
        run: git clone --filter=blob:none "$LTP_UPSTREAM" ltp

      - name: Install ltp-agent skills for Copilot
        run: $AGENT_DIR/setup.sh copilot

      - name: Install kernel source, man pages and C libraries
        run: |
          sudo apt-get update -qq
          sudo add-apt-repository -y ppa:git-core/ppa
          sudo apt-get install -yqq git-email
          sudo git clone --depth 1 https://github.com/torvalds/linux /usr/src/linux
          sudo git clone --depth 1 https://git.kernel.org/pub/scm/docs/man-pages/man-pages.git /usr/src/man-pages
          sudo git clone --depth 1 git://sourceware.org/git/glibc.git /usr/src/glibc
          sudo git clone --depth 1 git://git.musl-libc.org/musl /usr/src/musl

      - name: Resolve series metadata
        id: series
        run: |
          series_id="${{ inputs.SERIES_ID }}"
          output=$(pwclient list -p ltp -S "$series_id" -f $'%{id}\t%{msgid}\t%{submitter}\t%{name}')

          patch_ids=$(echo "$output" | cut -f1 | tr '\n' ' ')

          # Find patch 1/N by name; fall back to first line for single patches
          first=$(echo "$output" | grep -E '\b1/' | head -1)
          if [ -z "$first" ]; then
            first=$(echo "$output" | head -1)
          fi
          msgid=$(echo "$first" | cut -f2)
          submitter=$(echo "$first" | cut -f3)

          echo "patch_ids=$patch_ids" >> "$GITHUB_OUTPUT"
          echo "msgid=$msgid" >> "$GITHUB_OUTPUT"
          echo "submitter=$submitter" >> "$GITHUB_OUTPUT"

          echo "Series $series_id: patches=[$patch_ids] msgid=$msgid submitter=$submitter"

      - name: Apply patch series
        working-directory: ltp
        run: |
          git config user.name "LTP CI"
          git config user.email "ltp-ci@noreply.github.com"
          git checkout -b "review/series-${{ inputs.SERIES_ID }}" master

          b4 am -o - "${{ steps.series.outputs.msgid }}" | git am

          echo "### Patch Series" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Series ID:** ${{ inputs.SERIES_ID }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Branch:** $(git rev-parse --abbrev-ref HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commits:** $(git rev-list --count master..HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

      - name: Fetch latest stable kernel version
        id: kver
        run: |
          latest=$(curl -sf https://www.kernel.org/ | \
            grep -oP 'strong>\K[0-9]+\.[0-9]+(\.[0-9]+)?' | head -1)
          echo "version=${latest}" >> "$GITHUB_OUTPUT"
          echo "Latest stable kernel: ${latest}"

      - name: Run review
        id: review
        working-directory: ltp
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_TOKEN }}
          COPILOT_MODEL: ${{ vars.COPILOT_MODEL }}
          COPILOT_REASONING_EFFORT: ${{ vars.COPILOT_REASONING_EFFORT || 'high' }}
          LATEST_KERNEL: ${{ steps.kver.outputs.version }}
        run: |
          set -o pipefail

          model_info=""
          if [ -n "$COPILOT_MODEL" ]; then
            model_info="The AI model used for this review is ${COPILOT_MODEL}. "
          fi

          copilot -p "${model_info}The latest stable kernel release is ${LATEST_KERNEL}. Use this for staging checks instead of fetching kernel.org. Man pages are available in /usr/src/man-pages. Glibc is available in /usr/src/glibc. Musl is available in /usr/src/musl. Run /ltp-review." \
            --reasoning-effort "$COPILOT_REASONING_EFFORT" \
            --allow-all-tools \
            --deny-tool='shell(curl:*)' \
            --deny-tool='shell(wget:*)' \
            --deny-tool='shell(nc:*)' \
            --deny-tool='shell(ncat:*)' \
            --deny-tool='shell(ssh:*)' \
            --deny-tool='shell(scp:*)' \
            --deny-tool='shell(rsync:*)' \
            --deny-tool='shell(sendmail:*)' \
            --deny-tool='shell(mail:*)' \
            --deny-tool='shell(mailx:*)' \
            --deny-tool='shell(msmtp:*)' \
            --deny-tool='shell(git send-email:*)' \
            --deny-tool='shell(git push:*)' \
            --deny-tool='shell(sudo:*)' \
            --deny-tool='shell(apt:*)' \
            --deny-tool='shell(apt-get:*)' \
            --deny-tool='shell(npm:*)' \
            --deny-tool='shell(pip:*)' \
            --deny-tool='shell(pipx:*)' \
            --deny-tool='shell(docker:*)' \
            --deny-tool='shell(man:*)' \
            --deny-tool=web_fetch \
            --deny-tool=web_search \
            --add-dir="${{ github.workspace }}" \
            --add-dir="$HOME/.copilot" \
            --add-dir=/usr/src/linux \
            --add-dir=/usr/src/man-pages \
            --add-dir=/usr/src/glibc \
            --add-dir=/usr/src/musl \
            --no-ask-user

          # Extract verdict from review-inline.txt
          if [ -f review-inline.txt ] && grep -qi "Reviewed" review-inline.txt; then
            echo "verdict=success" >> "$GITHUB_OUTPUT"
            echo "description=Reviewed" >> "$GITHUB_OUTPUT"
          else
            echo "verdict=warning" >> "$GITHUB_OUTPUT"
            if [ -f review-inline.txt ] && grep -qi "Needs discussion" review-inline.txt; then
              echo "description=Needs discussion" >> "$GITHUB_OUTPUT"
            else
              echo "description=Needs revision" >> "$GITHUB_OUTPUT"
            fi
          fi

          echo "---" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f review-inline.txt ]; then
            cat review-inline.txt >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No review output produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Post results to Patchwork
        if: always()
        run: |
          if [ -z "${{ secrets.PATCHWORK_TOKEN }}" ]; then
            echo "PATCHWORK_TOKEN not set, skipping Patchwork update"
            exit 0
          fi

          echo "token = ${{ secrets.PATCHWORK_TOKEN }}" >> ~/.pwclientrc

          target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          context="copilot-review"

          # Use review verdict if available, otherwise mark as pending
          state="${{ steps.review.outputs.verdict }}"
          description="${{ steps.review.outputs.description }}"
          if [ -z "$state" ]; then
            state="pending"
            description="Review did not complete"
          fi

          for patch_id in ${{ steps.series.outputs.patch_ids }}; do
            [ -z "$patch_id" ] && continue

            echo "Posting check for patch $patch_id: state=$state"
            pwclient check-create -p ltp \
              -s "$state" -c "$context" \
              -u "$target_url" -d "$description" \
              "$patch_id"
          done

      - name: Send review to mailing list
        if: steps.review.outcome == 'success'
        working-directory: ltp
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          if [ -z "$SMTP_SERVER" ] || [ -z "$SMTP_USER" ] || [ -z "$SMTP_PASS" ]; then
            echo "SMTP credentials not configured, skipping email send"
            exit 0
          fi

          if [ ! -f review-inline.txt ]; then
            echo "review-inline.txt not found, skipping email send"
            exit 0
          fi

          body=$(cat review-inline.txt)

          submitter="${{ steps.series.outputs.submitter }}"
          msgid="${{ steps.series.outputs.msgid }}"
          case "$msgid" in "<"*) ;; *) msgid="<$msgid>" ;; esac

          subject="Re: $(git log --format='%s' --reverse master..HEAD | head -1)"

          git config --global sendemail.smtpSslCertPath ""

          mail_dir=$(mktemp -d)
          trap 'rm -rf "$mail_dir"' EXIT

          {
            echo "Subject: $subject"
            echo "In-Reply-To: $msgid"
            echo "References: $msgid"
            echo ""
            echo "$body"
          } > "$mail_dir/0001.email"

          git send-email \
            --from="$SMTP_USER" \
            --to="$submitter" \
            --cc=ltp@lists.linux.it \
            --smtp-server="$SMTP_SERVER" \
            --smtp-server-port="${SMTP_PORT:-587}" \
            --smtp-user="$SMTP_USER" \
            --smtp-pass="$SMTP_PASS" \
            --smtp-encryption=tls \
            --transfer-encoding=8bit \
            --confirm=never \
            --quiet \
            "$mail_dir"

          echo "Review email sent to $submitter (Cc: ltp@lists.linux.it)"
